# calendar.lan -> Calendar, que en el servidor escucha SÓLO en su IP de Tailscale.
# Este nginx es el de TU PORTÁTIL (no el del servidor): hace de puerta local con nombre, y el
# tráfico hasta el servidor va por Tailscale (cifrado con WireGuard). Calendar no se expone a Internet.
#
# El nombre calendar.lan se resuelve con /etc/hosts (lo añade nginx-local.sh); para que otros equipos
# de la red lo usen hay que darlo de alta también en tu DNS/router.
server {
    listen 80;
    listen [::]:80;
    server_name calendar.lan;

    access_log /var/log/nginx/calendar.lan.access.log;
    error_log  /var/log/nginx/calendar.lan.error.log;

    client_max_body_size 2m;           # el servidor admite 1 MB por petición

    location / {
        proxy_pass http://100.89.87.71:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
